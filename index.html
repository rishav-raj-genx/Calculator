<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator!</title>
    <link rel="stylesheet" href=" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="Cal.css">
</head>

<body>
    <div class="calculator">
        <div class="dis">
            <input type="text" readonly class="display" placeholder="00">
            <input type="text" readonly class="inpute" placeholder="00">
        </div>
        <div class="keys">
            <button class="button" id="color"><i class="fa-regular fa-sun fa-xs"
                    style="color: rgb(0, 221, 255);"></i></button>
            <button class="button white" id="left">C</button>
            <button class="button white" id="right">=</button>
            <button class="button white">(</button>
            <button class="button white">)</button>
            <button class="button white">%</button>
            <button class="button white">x</button>
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button white">/</button>
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button white">*</button>
            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button white">-</button>
            <button class="button">00</button>
            <button class="button">0</button>
            <button class="button">.</button>
            <button class="button white">+</button>
        </div>
    </div>
    <script src="Cal.js"></script>
</body>

</html>
